[package]
name = "web-controller"
version = "0.1.0"
edition = "2024"

[profile.dev]
lto = false
opt-level = 0
incremental = true
debug = true
codegen-units = 256

[dependencies]
actix-web = { version = "4", features = ["openssl"] }
actix-files = "0.6.6"
actix-ws = "0.3.0"
futures-util = "0.3"
openssl = { version = "0.10", features = ["vendored"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
rand = "0.8"
once_cell = "1.18"
tokio = "1.44.2"
